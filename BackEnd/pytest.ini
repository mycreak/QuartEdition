[pytest]
testpaths = test
python_files = test_*.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = 
    -v 
    --tb=short 
    --strict-markers
filterwarnings = 
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    slow: 标记慢速测试（默认跳过）
    e2e: 端到端测试
    integration: 集成测试
    unit: 单元测试
    crawler: 爬虫相关测试
    auth: 认证相关测试
    db: 数据库相关测试
