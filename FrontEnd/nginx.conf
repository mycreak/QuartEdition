# ═══════════════════════════════════════════════════════════════
# FrontEnd/nginx.conf
# 职责：
#   1. 托管 Vue SPA 静态文件（history mode 回退）
#   2. 反向代理 /api/ 请求到后端 (backend:8000)
#   3. 代理 WebSocket /ws/ 连接（Upgrade + Connection 头）
#   4. 安全头注入 + gzip 压缩 + 缓存策略
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    # 客户端请求体上限（头像/海报上传走 /api/）
    client_max_body_size 20m;

    # gzip 压缩（减少传输体积 60-80%）
    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ── 前端静态文件 ──
    # 带 hash 的资源（js/css/font）设置长期缓存（一年）
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA 主入口：所有非 /api/ /ws/ 路径回退到 index.html（Vue Router history mode）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── API 反向代理到后端 ──
    location /api/ {
        # 去掉 /api 前缀后转发（与 Vite dev proxy 行为一致）
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（爬虫任务可能长时间运行）
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── WebSocket 代理 ──
    location /ws/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 长连接超时（系统监控推送是持续连接）
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 安全头（生产环境基础配置） ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
