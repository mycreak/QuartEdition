# ═══════════════════════════════════════════════════════════════
# QuartEdition — Docker Compose 编排
#
# 启动:    docker compose up -d
# 停止:    docker compose down
# 重建:    docker compose up -d --build
# 日志:    docker compose logs -f backend
# 数据库:  docker compose exec mysql mysql -u root -p
#
# 服务依赖链:
#   mysql / mongodb / redis (先行, healthcheck)
#       └── backend (依赖 DBs 全部 healthy)
#               └── frontend (依赖 backend healthy)
#
# 网络: 172.20.0.0/16 隔离子网
# 卷:   命名卷持久化数据库数据（即使 docker compose down 也不丢失）
# ═══════════════════════════════════════════════════════════════

services:
  # ────────────────── MySQL 8.0 ──────────────────
  mysql:
    image: mysql:8.0
    container_name: quart_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-movie_db}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动时自动执行初始化 SQL（按文件名排序执行）
      - ./db_init/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - quart_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ────────────────── MongoDB 7.0 ──────────────────
  mongodb:
    image: mongo:7.0
    container_name: quart_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-123456}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-movie_db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./db_init/mongo:/docker-entrypoint-initdb.d:ro
    networks:
      - quart_net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet -u ${MONGO_USER:-root} -p ${MONGO_PASSWORD:-123456} --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ────────────────── Redis 7 ──────────────────
  redis:
    image: redis:7-alpine
    container_name: quart_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-123456}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - quart_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ────────────────── 后端 (Quart + Hypercorn) ──────────────────
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    image: quart-edition-backend:latest
    container_name: quart_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ── JWT（生产环境务必修改！） ──
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-string-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-604800}

      # ── MySQL（pydantic-settings env_prefix=MYSQL_） ──
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-movie_db}

      # ── Redis（pydantic-settings env_prefix=REDIS_） ──
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      REDIS_DB: 0

      # ── MongoDB（pydantic-settings env_prefix=MONGO_） ──
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-root}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-123456}
      MONGO_DATABASE: ${MONGO_DATABASE:-movie_db}

      # ── 服务绑定 ──
      BIND: "0.0.0.0:8000"
      SNOWFLAKE_MACHINE_ID: ${SNOWFLAKE_MACHINE_ID:-1}

      # ── 日志 ──
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_TO_FILE: "true"

      # ── DeepSeek AI（可选） ──
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_ENDPOINT: ${DEEPSEEK_ENDPOINT:-https://api.deepseek.com/v1/chat/completions}

      # ── 火山引擎 TOS 图床（可选） ──
      TOS_ENDPOINT: ${TOS_ENDPOINT:-tos-cn-guangzhou.volces.com}
      TOS_REGION: ${TOS_REGION:-cn-guangzhou}
      TOS_ACCESS_KEY: ${TOS_ACCESS_KEY:-}
      TOS_SECRET_KEY: ${TOS_SECRET_KEY:-}
      TOS_BUCKET: ${TOS_BUCKET:-movie-poster}

      # ── 付费代理种子（可选） ──
      PAID_PROXIES: ${PAID_PROXIES:-}

      # ── 浏览器无头模式 ──
      CRAWLER_HEADLESS: "true"

    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # 数据持久化（Cookie / 代理）
      - backend_data:/app/data
      - backend_logs:/app/logs
    networks:
      - quart_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # 限制资源（爬虫 + Playwright 内存大户）
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
        reservations:
          cpus: "1"
          memory: 1g

  # ────────────────── 前端 (Vue 3 + Nginx) ──────────────────
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/notifications}
    image: quart-edition-frontend:latest
    container_name: quart_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - quart_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# ────────────────── 命名卷（持久化数据） ──────────────────
volumes:
  mysql_data:
    driver: local
    name: quart_mysql_data
  mongo_data:
    driver: local
    name: quart_mongo_data
  mongo_config:
    driver: local
    name: quart_mongo_config
  redis_data:
    driver: local
    name: quart_redis_data
  backend_data:
    driver: local
    name: quart_backend_data
  backend_logs:
    driver: local
    name: quart_backend_logs

# ────────────────── 网络 ──────────────────
networks:
  quart_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
